server:
  port: 8081

spring:
  application:
    name: users-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

auth:
  token:
    expiration: ${AUTH_TOKEN_EXPIRATION:60}
    secret: ${JWT_SECRET:PragmaJwtSecret_2026_fK2mQ9xL7vN4pR6tY3wZ1aB5cD8eF0gH}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: INFO